<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的存錢筒</title>
<!-- 刻意不放 manifest：iOS「加入主畫面」會記住目前網址（含 ?k= 專屬碼） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="我的存錢筒">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fff4dc">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icons/icon-kid-180.png?v=2">
<link rel="icon" href="icons/icon-kid-180.png?v=2">
<script src="config.js"></script>
<script src="chart.js?v=1"></script>
<style>
:root{--bg:#fff4dc;--card:#fff;--ink:#3b2f20;--muted:#8a7a63;--orange:#f08a24;--green:#2fa36b;--gold:#e6a700;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;-webkit-user-select:none;user-select:none}
body{padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:860px;margin:0 auto}
.hero{text-align:center;padding:20px 10px 10px}
.pig{width:120px;height:120px;border-radius:28px;display:inline-block;animation:bob 2.6s ease-in-out infinite}
.err img{width:84px;height:84px;border-radius:20px}
@keyframes bob{50%{transform:translateY(-8px)}}
.hello{font-size:22px;margin:10px 0 2px;font-weight:700}
.money{font-size:clamp(56px,14vw,96px);font-weight:900;color:var(--orange);letter-spacing:-2px;font-variant-numeric:tabular-nums}
.money small{font-size:.35em;margin-left:6px;color:var(--ink)}
.moneyrow{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.refresh{font:inherit;font-size:18px;font-weight:800;border:0;border-radius:16px;padding:12px 18px;background:#fff;color:var(--orange);box-shadow:0 3px 0 #f0dfbd;cursor:pointer}
.refresh:active{transform:translateY(2px);box-shadow:0 1px 0 #f0dfbd}
.refresh.busy .spin{display:inline-block;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}
.card{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 4px 0 #f0dfbd}
.card h2{margin:0 0 12px;font-size:20px}
.goal{margin:14px 0}
.goal .t{display:flex;justify-content:space-between;font-size:18px;font-weight:700}
.goal .t span{color:var(--muted);font-weight:600;font-size:15px}
.track{height:22px;background:#f6ead2;border-radius:12px;margin-top:8px;overflow:hidden;position:relative}
.track i{display:block;height:100%;background:linear-gradient(90deg,#ffc24d,var(--orange));border-radius:12px;transition:width .8s}
.track b{position:absolute;right:10px;top:0;line-height:22px;font-size:13px}
.ok{color:var(--green);font-weight:800;margin-top:6px}
.stampcard{margin:14px 0 18px}
.stampcard .t{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:700}
.badge{background:#fff1c2;color:#9a6b00;border-radius:99px;padding:4px 10px;font-size:14px}
.dots{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.dot{width:38px;height:38px;border-radius:50%;border:3px dashed #e8d6b0;display:grid;place-items:center;font-size:20px}
.dot.on{border:3px solid var(--gold);background:#fff6d6}
.empty{color:var(--muted);font-size:16px}
.wide{grid-column:1/-1}
.lghead{display:flex;justify-content:space-between;align-items:center}
.lghead h2{margin:0}
.toggle{font:inherit;font-size:16px;font-weight:700;border:0;border-radius:12px;padding:8px 14px;background:#fff1c2;color:#9a6b00;cursor:pointer}
.lg{margin-top:10px}
.lgrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed #f0dfbd}
.lgrow:last-child{border-bottom:0}
.lgdate{width:52px;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.lgmain{flex:1;min-width:0;font-size:17px}
.lgmain small{display:block;color:var(--muted);font-size:13px}
.lgamt{font-weight:900;font-size:19px;font-variant-numeric:tabular-nums}
.in{color:var(--green)} .out{color:#d9534f}
.more{display:block;width:100%;margin-top:10px;font:inherit;font-size:16px;border:0;border-radius:12px;padding:10px;background:#fff6e0;color:#9a6b00;cursor:pointer}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
.err{text-align:center;margin-top:20vh;font-size:20px}
</style>
</head>
<body>
<div class="wrap" id="root"><div class="err"><img src="icons/icon-cat.svg" alt=""><br>載入中…</div></div>
<script>
'use strict';
const CFG = window.APP_CONFIG || {};
const KEY = 'ks_kid_token';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ledgerOpen = false, ledgerShown = 20, lastData = null;
try { ledgerOpen = localStorage.getItem('ks_kid_ledger_open') === '1'; } catch {}
const fmt = n => Number(n || 0).toLocaleString('zh-TW', { maximumFractionDigits: 0 });

// 專屬碼：優先用網址的 ?k=，並存起來當備份
let token = new URLSearchParams(location.search).get('k');
try { if (token) localStorage.setItem(KEY, token); else token = localStorage.getItem(KEY); } catch {}

const DATA_KEY = 'ks_kid_data';
let loading = false;
function setBusy(on) { const b = document.getElementById('refreshBtn'); if (b) b.classList.toggle('busy', on); }
async function load() {
  if (!token) return fail('這個連結少了專屬碼，請跟爸媽要正確的連結');
  if (loading) return; loading = true; setBusy(true);
  try {
    const r = await fetch(CFG.API_URL, { method: 'POST', body: JSON.stringify({ action: 'kid', token }) });
    const j = await r.json();
    if (!j.ok) { try { localStorage.removeItem(DATA_KEY); } catch {} return fail(j.error || '讀取失敗'); }
    try { localStorage.setItem(DATA_KEY, JSON.stringify(j.data)); } catch {}
    render(j.data);
  } catch (e) { if (!lastData) fail('網路好像斷了，等一下再試試看'); }
  finally { loading = false; setBusy(false); }
}
// 先顯示上次的資料，背景再抓最新
(function showCached() {
  try { const d = JSON.parse(localStorage.getItem(DATA_KEY) || 'null'); if (d && token) render(d); } catch {}
})();
function fail(msg) { document.getElementById('root').innerHTML = `<div class="err"><img src="icons/icon-cat.svg" alt=""><br>${esc(msg)}</div>`; }

function ledgerCard(rows) {
  const md = iso => { const t = new Date(iso); return isNaN(t) ? '' : `${t.getMonth() + 1}/${t.getDate()}`; };
  const list = rows.slice(0, ledgerShown).map(r => `
    <div class="lgrow"><div class="lgdate">${md(r.time)}</div>
      <div class="lgmain">${esc(r.typeLabel)}${r.note ? '・' + esc(r.note) : ''}${r.amount > 0 && r.source && r.type !== 'interest' ? `<small>${esc(r.source)}給的</small>` : ''}</div>
      <div class="lgamt ${r.amount >= 0 ? 'in' : 'out'}">${r.amount > 0 ? '+' : r.amount < 0 ? '−' : ''}${fmt(Math.abs(r.amount))}</div></div>`).join('');
  return `<div class="card wide">
    <div class="lghead"><h2>📒 明細</h2><button class="toggle" id="lgToggle">${ledgerOpen ? '收合 ▴' : `展開 ▾（${rows.length} 筆）`}</button></div>
    ${ledgerOpen ? `<div class="lg">${list || '<div class="empty">還沒有紀錄</div>'}</div>
      ${rows.length > ledgerShown ? `<button class="more" id="lgMore">再看更多（還有 ${rows.length - ledgerShown} 筆）</button>` : ''}` : ''}
  </div>`;
}

function render(d) {
  lastData = d;
  const goals = d.goals.map(g => `
    <div class="goal">
      <div class="t">${esc(g.name)}<span>${fmt(g.target)} 元</span></div>
      <div class="track"><i style="width:${Math.round(g.progress * 100)}%"></i><b>${Math.round(g.progress * 100)}%</b></div>
      ${g.progress >= 1 ? '<div class="ok">🎉 存夠了！快去跟爸媽說</div>'
        : `<div class="empty" style="font-size:14px;margin-top:4px">還差 ${fmt(Math.max(0, g.target - d.balance))} 元</div>`}
    </div>`).join('');
  const stamps = d.stamps.map(s => `
    <div class="stampcard">
      <div class="t">${esc(s.name)}<span class="badge">🏆 集滿 ${s.cards} 張</span></div>
      <div class="dots">${Array.from({ length: s.target }, (_, i) => `<div class="dot ${i < s.inCard ? 'on' : ''}">${i < s.inCard ? '⭐' : ''}</div>`).join('')}</div>
    </div>`).join('');
  document.getElementById('root').innerHTML = `
    <div class="hero">
      <img class="pig" src="icons/icon-cat.svg" alt="">
      <div class="hello">${esc(d.kidName)}的存錢筒</div>
      <div class="moneyrow"><div class="money">${fmt(d.balance)}<small>元</small></div><button class="refresh" id="refreshBtn" aria-label="更新資料"><span class="spin">↻</span> 更新</button></div>
    </div>
    <div class="grid">
      <div class="card"><h2>🎯 我的目標</h2>${goals || '<div class="empty">還沒有目標，跟爸媽一起訂一個吧！</div>'}
        ${d.doneGoals ? `<div class="empty" style="margin-top:8px">已經完成 ${d.doneGoals} 個目標 👏</div>` : ''}</div>
      <div class="card"><h2>⭐ 集章卡</h2>${stamps || '<div class="empty">還沒有集章任務</div>'}</div>
      ${d.history ? '<div class="card wide"><h2>📈 我的存錢曲線</h2><div id="kidChart"></div></div>' : ''}
      ${d.ledger ? ledgerCard(d.ledger) : ''}
    </div>
    <div class="foot">更新時間 ${new Date(d.updated).toLocaleString('zh-TW', { hour12: false })}</div>`;
  if (d.history && window.renderSavingsChart)
    renderSavingsChart(document.getElementById('kidChart'), d.history, { color: '#f08a24', ink: '#3b2f20', muted: '#8a7a63', grid: '#f3e6cc' });
}

document.addEventListener('click', e => {
  if (e.target.closest('#lgToggle')) {
    ledgerOpen = !ledgerOpen; ledgerShown = 20;
    try { localStorage.setItem('ks_kid_ledger_open', ledgerOpen ? '1' : '0'); } catch {}
    const y = window.scrollY; render(lastData); window.scrollTo(0, y);
  } else if (e.target.closest('#lgMore')) {
    ledgerShown += 20; const y = window.scrollY; render(lastData); window.scrollTo(0, y);
  }
});
document.addEventListener('click', async e => {
  if (!e.target.closest('#refreshBtn')) return;
  await load();
});
load();
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
